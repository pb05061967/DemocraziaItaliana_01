{era:"Le origini (1797–1861)",y:"1797–1799",cat:"pol",col:"#378ADD",

 txt:"<p>Con le campagne napoleoniche nascono le prime Repubbliche moderne: <strong>Cisalpina, Romana, Partenopea</strong>. Per la prima volta si applicano uguaglianza davanti alla legge, libertà di stampa, abolizione dei privilegi feudali.</p><p>Queste esperienze, pur brevi, seminano i germi del Risorgimento: <em>sovranità popolare, diritti civili, separazione dei poteri</em>.</p>",

{y:"1820–1848",cat:"soc",col:"#1D9E75",

{y:"4 Marzo 1848",cat:"pol",col:"#378ADD",
 title:"Lo Statuto Albertino",sub:"La prima Costituzione del futuro Stato italiano",
 img:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Statuto_Albertino_manoscritto.jpg/480px-Statuto_Albertino_manoscritto.jpg",

 yturl:"https://www.youtube.com/watch?v=UZiEqeqK2kI",ytlbl:"Lo Statuto Albertino spiegato",
 txt:"<p>Carlo Alberto promulga lo Statuto: monarchia costituzionale, Parlamento bicamerale, voto censitario. Pur limitato, resterà la carta fondamentale dell'Italia unita <strong>dal 1861 al 1948</strong>.</p>",

{y:"17 Marzo 1861",cat:"pol",col:"#378ADD",
 title:"Nasce il Regno d'Italia",sub:"Vittorio Emanuele II primo re — solo il 2,5% vota",

 yturl:"https://www.youtube.com/watch?v=9DZGrHm9Mtg",ytlbl:"L'Unità d'Italia — documentario",
 txt:"<p>La penisola è finalmente unita, ma la democrazia è ancora élitaria. Solo il <strong>2,5% della popolazione</strong> ha diritto di voto. Il Parlamento esiste, ma il potere reale rimane al re e a ristrette classi dirigenti.</p>",

/* ── REGNO D'ITALIA ── */
{era:"Il Regno d'Italia (1861–1922)",y:"1912",cat:"soc",col:"#1D9E75",

 txt:"<p>La riforma <strong>Giolitti</strong> estende il voto a quasi tutti i maschi adulti. I partiti di massa — socialisti e cattolici — entrano per la prima volta nella politica. Le <strong>donne</strong> restano escluse fino al 1945.</p>",

{y:"1915–1918",cat:"war",col:"#D85A30",

{era:"Fascismo e Resistenza (1922–1945)",y:"28 Ott 1922",cat:"war",col:"#D85A30",

{y:"1938",cat:"war",col:"#D85A30",

{y:"22 Dic 1947",cat:"cost",col:"#7F77DD",
 title:"L'Assemblea Costituente approva la Costituzione",sub:"575 articoli, 18 mesi di lavoro",
 img:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Assemblea_Costituente_italiana.jpg/480px-Assemblea_Costituente_italiana.jpg",

 txt:"<p>Dopo 18 mesi di lavoro, i <strong>556 costituenti</strong> — tra cui <strong>21 donne</strong> — approvano la Costituzione il 22 dicembre 1947. Entra in vigore il 1° gennaio 1948. L'art. 1: <em>«L'Italia è una Repubblica democratica, fondata sul lavoro»</em>.</p><p>Tra i padri costituenti: <strong>De Gasperi, Togliatti, Nenni, La Pira, Nilde Iotti</strong>. Un documento nato dal dialogo tra culture diverse.</p>",

{y:"1 Gen 1948",cat:"cost",col:"#7F77DD",
 title:"Entra in vigore la Costituzione Italiana",sub:"«La sovranità appartiene al popolo»",

/* ── DEMOCRAZIA IN CAMMINO ── */
{era:"La democrazia in cammino (1948–oggi)",y:"1948",cat:"pol",col:"#378ADD",
 title:"Elezioni del 18 aprile 1948",sub:"Il primo voto libero della Repubblica",

 txt:"<p>Le prime elezioni libere della Repubblica: la <strong>Democrazia Cristiana</strong> di De Gasperi vince con il 48,5%. Si confrontano due visioni del mondo — atlantismo e blocco sovietico — in piena Guerra Fredda. L'Italia sceglie l'Occidente.</p><p>Per la prima volta tutti i cittadini, uomini e donne, esercitano il diritto di voto garantito dalla Costituzione.</p>",
 tags:["Elezioni","De Gasperi","DC","PCI","1948","Guerra Fredda"]},

{y:"1970",cat:"dir",col:"#C0973A",
 title:"Statuto dei Lavoratori e istituzione delle Regioni",sub:"Democrazia dal basso, diritti sul lavoro",
 img:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Statuto_dei_lavoratori_1970.jpg/440px-Statuto_dei_lavoratori_1970.jpg",
 icap:"Lo Statuto dei Lavoratori, legge 300/1970 (Wikimedia Commons)",
 yturl:"https://www.youtube.com/watch?v=r9o5MgBxKtM",ytlbl:"Lo Statuto dei Lavoratori — spiegato",
 txt:"<p>Il <strong>1970</strong> è un anno cruciale: lo <strong>Statuto dei Lavoratori</strong> (legge 300) garantisce i diritti fondamentali nei luoghi di lavoro. Nello stesso anno nascono le <strong>Regioni</strong> a statuto ordinario, portando la democrazia più vicina ai cittadini.</p><p>È anche l'anno in cui viene introdotto il <strong>divorzio</strong>, confermato dal referendum del 1974.</p>",
 tags:["Statuto Lavoratori","Regioni","Diritti","1970","Divorzio"]},

{y:"1978",cat:"dir",col:"#C0973A",

 img:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Aldo_Moro.jpg/400px-Aldo_Moro.jpg",

 txt:"<p>Il <strong>16 marzo 1978</strong> le Brigate Rosse rapiscono e poi uccidono <strong>Aldo Moro</strong>, presidente della DC e artefice del compromesso storico. Gli anni di piombo mettono alla prova la tenuta democratica del Paese.</p><p>Le istituzioni resistono. La risposta dello Stato non sospende le garanzie costituzionali: è la dimostrazione più alta della maturità della democrazia italiana.</p>",

{y:"2007",cat:"dir",col:"#C0973A",

 yturl:"https://www.youtube.com/watch?v=DP_oTBqiLQk",ytlbl:"Storia dell'Unione Europea",

let currentEra="";

function build(){
  const tl=document.getElementById('tl');
  EV.forEach((e,i)=>{
    if(e.era && e.era!==currentEra){
      currentEra=e.era;
      const div=document.createElement('div');
      div.className='era-divider';
      div.innerHTML=`<span>${e.era}</span>`;
      div.dataset.era=e.era;
      tl.appendChild(div);
    }
    const d=document.createElement('div');
    d.className='tl-item';
    d.dataset.cat=e.cat;
    d.innerHTML=`
      <div class="tl-num" style="background:${e.col}">${i+1}</div>
      <div class="tl-card" id="c${i}" onclick="tog(${i})">
        <div class="tl-head">
          <span class="tl-badge">${e.y}</span>
          <span class="tl-cdot" style="background:${e.col}"></span>
          <div class="tl-titles">
            <div class="tl-title">${e.title}</div>
            <div class="tl-sub">${e.sub}</div>
          </div>
          <i class="ti ti-chevron-down tl-chev"></i>
        </div>
        <div class="tl-body">
          <div class="img-zone">
            <img src="${e.img}" alt="${e.title}" loading="lazy"
              onerror="this.parentNode.innerHTML='<div class=ipl><span>🏛️</span><p>${e.title}</p></div>'">
            <div class="icap">${e.icap}</div>
          </div>
          <a class="yt-btn" href="${e.yturl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            <div class="yt-icon"></div>
            <span>${e.ytlbl}</span>
            <i class="ti ti-external-link" style="margin-left:auto;font-size:13px"></i>
          </a>
          <div class="tl-txt">${e.txt}</div>
          <div class="tl-tags">${e.tags.map(t=>`<span class="tl-tag">${t}</span>`).join('')}</div>
        </div>
      </div>`;
    tl.appendChild(d);
  });
}

function tog(i){document.getElementById('c'+i).classList.toggle('open')}

function filt(cat,btn){
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.tl-item').forEach(it=>{
    it.classList.toggle('hidden',cat!=='all'&&it.dataset.cat!==cat);
  });
}

build();
</script>
